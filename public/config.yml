backend:
  name: github
  repo: Theani7/portfolio
  branch: main
  base_url: ""
  auth_endpoint: /api/auth

local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site_data
    label: Site Data
    files:
      - label: Projects
        name: projects
        file: src/data/projects.json
        format: json
        fields:
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: number, value_type: int, min: 1 }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Tags
                name: tags
                widget: list
                field: { label: Tag, name: tag, widget: string }
              - { label: Image URL, name: image, widget: string, required: false }
              - { label: Demo URL, name: demo, widget: string }
              - { label: GitHub URL, name: github, widget: string, required: false }
